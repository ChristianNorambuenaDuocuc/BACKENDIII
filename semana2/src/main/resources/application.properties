spring.application.name=semana2

# ===============================
# BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/banco_batch
spring.datasource.username=root
spring.datasource.password=Oraclecloud2025
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# INICIALIZACION SQL
# ===============================

spring.sql.init.mode=always


# ===============================
# SPRING BATCH
# ===============================

spring.batch.jdbc.initialize-schema=always

spring.batch.job.name=procesoCompletoJob


# =====================================================
# CONFIGURACIÓN DE TASAS DE INTERÉS
# =====================================================

# Tasa aplicada a cuentas de ahorro.
# 0.01 equivale a un 1%.
# Si este valor cambia, las próximas ejecuciones del batch
# calcularán el interés utilizando la nueva tasa.
intereses.tasa.ahorro=0.01

# Tasa aplicada a cuentas de préstamo.
# 0.02 equivale a un 2%.
# Si este valor cambia, las próximas ejecuciones del batch
# calcularán el interés utilizando la nueva tasa.
intereses.tasa.prestamo=0.02
